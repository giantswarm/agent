        - tool:t122
        - tool:t123
        - tool:t124
        - tool:t125
        - tool:t126
        - tool:t127
    asserts:
      - matchRegex:
          path: spec.headersFrom[0].value
          pattern: ^tool:t0,(tool:t[0-9]+,){126}tool:t127$

  - it: keeps the server when preset:none is combined with other selectors
    set:
      toolset:
        - preset:none
        - tool:x_mcp-kubernetes_get_pods
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.headersFrom[0].value
          value: preset:none,tool:x_mcp-kubernetes_get_pods

  # omission
  - it: renders no server for exactly ["preset:none"]
    set:
      toolset:
        - preset:none
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no server when muster is disabled
    set:
      toolset:
        - preset:read-only
      muster:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # muster values
  - it: points at muster.url
    set:
      muster:
        url: https://muster.example.com/mcp
    asserts:
      - equal:
          path: spec.url
          value: https://muster.example.com/mcp

  - it: refuses a muster.url that is not http(s)
    set:
      muster:
        url: muster.agent-platform.svc.cluster.local:8090/mcp
    asserts:
      - failedTemplate:
          errorPattern: 'muster[./]url'

  - it: renders muster.timeout as given
    set:
      muster:
        timeout: 5m
    asserts:
      - equal:
          path: spec.timeout
          value: 5m

  - it: refuses a muster.timeout without a unit
    set:
      muster:
        timeout: "180"
    asserts:
      - failedTemplate:
          errorPattern: 'muster[./]timeout'

  - it: drops the discovery opt-out label when muster.discovery.enabled is true
    set:
      muster:
        discovery:
          enabled: true
    asserts:
      - notExists:
          path: metadata.labels["kagent.dev/discovery"]

  - it: keeps muster.tools on the binding, not on the server
    set:
      muster:
        tools:
          - list_tools
    asserts:
      - notExists:
          path: spec.tools

  # isolation
  - it: carries extra labels but keeps the discovery opt-out its own
    set:
      labels:
        giantswarm.io/owner: sre-team
        kagent.dev/discovery: enabled
    asserts:
      - equal:
          path: metadata.labels["giantswarm.io/owner"]
          value: sre-team
      - equal:
          path: metadata.labels["kagent.dev/discovery"]
          value: disabled

  - it: is not reached by annotations or extraAgentSpec
    set:
      agent:
        displayName: SRE Assistant
      annotations:
        giantswarm.io/owner: sre-team
      extraAgentSpec:
        url: https://elsewhere.example.com/mcp
        description: overridden
    asserts:
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.url
          value: http://muster.agent-platform.svc.cluster.local:8090/mcp
      - equal:
          path: spec.description
          value: muster MCP gateway of agent demo (implicit full access)

  - it: keeps the chart and version labels valid when the 63-character cut lands on the digest separator
    chart:
      version: 0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8+ed59d4befc7e
    asserts:
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^[a-zA-Z0-9][-A-Za-z0-9_.]{0,61}[a-zA-Z0-9]$
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: agent-0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: ^[a-zA-Z0-9][-A-Za-z0-9_.]{0,61}[a-zA-Z0-9]$

  - it: renders 8192 bytes
    set:
      toolset: ["tool:"]
    asserts:
      - equal:
          path: spec.headersFrom[0].value
          value: "tool:"

  - it: refuses 8193 bytes
    set:
      toolset: ["tool:"]
    asserts:
      - failedTemplate:
          errorPattern: toolset encodes to 8193 bytes.*8192

  - it: renders UTF-8 bytes at limit
    set:
      toolset: ["tool:éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé