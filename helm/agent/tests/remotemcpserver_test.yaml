# Render tests for the agent's muster RemoteMCPServer (api.kagent.dev/v1alpha3):
# the carrier of the toolset, named after the agent, in the agent's namespace.
#
# Run with: make helm-test (helm unittest helm/agent). The default-render
# snapshot in __snapshot__/ is the golden file of the 2.0 contract; update it
# only on purpose (make helm-unittest-update) and say so in the PR.
suite: remotemcpserver
templates:
  - templates/remotemcpserver.yaml
release:
  name: demo
  namespace: demo-ns
tests:
  - it: renders the default values (golden)
    asserts:
      - hasDocuments:
          count: 1
      - matchSnapshot: {}
      - isAPIVersion:
          of: api.kagent.dev/v1alpha3
      - isKind:
          of: RemoteMCPServer
      - equal:
          path: metadata.name
          value: demo
      - equal:
          path: metadata.namespace
          value: demo-ns
      - equal:
          path: metadata.labels["kagent.dev/discovery"]
          value: disabled
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: demo
      - notExists:
          path: metadata.labels["agent-platform.giantswarm.io/harness"]
      - equal:
          path: spec.url
          value: http://muster.agent-platform.svc.cluster.local:8090/mcp
      - equal:
          path: spec.protocol
          value: STREAMABLE_HTTP
      - equal:
          path: spec.description
          value: muster MCP gateway of agent demo (implicit full access)
      - equal:
          path: spec.timeout
          value: 60m
      - notExists:
          path: spec.headersFrom

  - it: never carries an Authorization header
    set:
      toolset:
        - preset:read-only
    asserts:
      - notMatchRegexRaw:
          pattern: '(?i)authorization'

  - it: is untouched by muster.requireApproval (the pause is the binding's, not the server's)
    set:
      muster:
        requireApproval: true
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegexRaw:
          pattern: requireApproval
      - equal:
          path: spec
          value:
            description: muster MCP gateway of agent demo (implicit full access)
            url: http://muster.agent-platform.svc.cluster.local:8090/mcp
            protocol: STREAMABLE_HTTP
            timeout: 60m

  - it: follows agent.name
    set:
      agent:
        name: sre-assistant
    asserts:
      - equal:
          path: metadata.name
          value: sre-assistant
      - equal:
          path: spec.description
          value: muster MCP gateway of agent sre-assistant (implicit full access)

  # toolset -> X-Muster-Toolset header in spec.headersFrom
  - it: renders the toolset as the X-Muster-Toolset header
    set:
      toolset:
        - preset:read-only
        - workflow:incident-triage
    asserts:
      - equal:
          path: spec.headersFrom
          value:
            - name: X-Muster-Toolset
              value: preset:read-only,workflow:incident-triage
      - equal:
          path: spec.description
          value: muster MCP gateway of agent demo (toolset preset:read-only,workflow:incident-triage)

  - it: accepts every selector kind and joins them with a comma and no spaces
    set:
      toolset:
        - preset:full
        - server:mcp-kubernetes
        - workflow:incident-triage
        - tool:x_mcp-kubernetes_get_pods
        - tool:core_service_list
    asserts:
      - equal:
          path: spec.headersFrom[0].value
          value: preset:full,server:mcp-kubernetes,workflow:incident-triage,tool:x_mcp-kubernetes_get_pods,tool:core_service_list

  - it: renders 128 selectors
    set:
      toolset:
        - tool:t0
        - tool:t1
        - tool:t2
        - tool:t3
        - tool:t4
        - tool:t5
        - tool:t6
        - tool:t7
        - tool:t8
        - tool:t9
        - tool:t10
        - tool:t11
        - tool:t12
        - tool:t13
