# Render tests for the Agent (api.kagent.dev/v1alpha3) the chart produces: the
# template inline under spec.template, the Harness by name in spec.harnessRef.
#
# Run with: make helm-test (helm unittest helm/agent). The chart-test CircleCI
# job runs the same target on every PR (.circleci/custom.yml).
#
# The default-render snapshot in __snapshot__/ is the golden file of the 2.0
# contract. Update it only on purpose (make helm-unittest-update) and say so
# in the PR. Schema errors are matched on the value path only, because the
# message wording differs between Helm versions.
suite: agent
templates:
  - templates/agent.yaml
release:
  name: demo
  namespace: demo-ns
tests:
  - it: renders the default values (golden)
    asserts:
      - hasDocuments:
          count: 1
      - matchSnapshot: {}
      - isAPIVersion:
          of: api.kagent.dev/v1alpha3
      - isKind:
          of: Agent
      - equal:
          path: metadata.name
          value: demo
      - equal:
          path: metadata.namespace
          value: demo-ns
      - notExists:
          path: metadata.labels["agent-platform.giantswarm.io/harness"]
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: demo
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.harnessRef
          value:
            name: kagent
      - notExists:
          path: spec.templateRef
      - notExists:
          path: spec.harness
      - notExists:
          path: spec.template.plugins
      - equal:
          path: spec.template.modelConfig.name
          value: default-model-config
      - equal:
          path: spec.template.systemPrompt
          value: You are a helpful agent.
      - notExists:
          path: spec.template.context
      - notExists:
          path: spec.template.description
      - notExists:
          path: spec.template.skills
      - lengthEqual:
          path: spec.template.tools
          count: 1
      - equal:
          path: spec.template.tools[0].mcp.server
          value:
            kind: RemoteMCPServer
            name: demo
      - notExists:
          path: spec.template.tools[0].mcp.tools
      - notExists:
          path: spec.template.tools[0].mcp.requireApproval

  # identity
  - it: names the agent and its binding after agent.name when set
    set:
      agent:
        name: sre-assistant
    asserts:
      - equal:
          path: metadata.name
          value: sre-assistant
      - equal:
          path: spec.template.tools[0].mcp.server.name
          value: sre-assistant

  - it: renders description and a multi-line system prompt
    set:
      agent:
        description: Helps the SRE team triage incidents.
        systemMessage: |
          You are an SRE assistant.
          Be concise.
    asserts:
      - equal:
          path: spec.template.description
          value: Helps the SRE team triage incidents.
      - equal:
          path: spec.template.systemPrompt
          value: |-
            You are an SRE assistant.
            Be concise.

  # platform prompt
  - it: appends the network access note naming agent.egress
    set:
      agent:
        systemMessage: |
          You keep the GitOps repositories tidy.
        egress:
          - https://github.com
          - https://*.githubusercontent.com
        platformPrompt:
          egressNote: true
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            You keep the GitOps repositories tidy.

            ## Network access (set by the platform)

            Besides your model and your tools, your sandbox reaches only these origins: https://github.com, https://*.githubusercontent.com, and the registries of the toolchains mounted under /opt/kagent/tools. A request to any other host is refused by the egress policy and shows up as a failed command or tool call (connection refused, reset or 403). It is not transient: do not retry it or work around it; say which host the task needs.

  - it: names only the toolchain registries in the network access note without agent.egress
    set:
      agent:
        platformPrompt:
          egressNote: true
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            You are a helpful agent.

            ## Network access (set by the platform)

            Besides your model and your tools, your sandbox reaches only the registries of the toolchains mounted under /opt/kagent/tools. A request to any other host is refused by the egress policy and shows up as a failed command or tool call (connection refused, reset or 403). It is not transient: do not retry it or work around it; say which host the task needs.

  - it: replaces a network access note in systemMessage with the chart's
    set:
      agent:
        systemMessage: |-
          You keep the GitOps repositories tidy.

          ## Network access (set by the platform)

          Besides your model and your tools, your sandbox reaches only these origins: https://example.com, and an outdated wording.
        egress:
          - https://github.com
        platformPrompt:
          egressNote: true
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            You keep the GitOps repositories tidy.

            ## Network access (set by the platform)

            Besides your model and your tools, your sandbox reaches only these origins: https://github.com, and the registries of the toolchains mounted under /opt/kagent/tools. A request to any other host is refused by the egress policy and shows up as a failed command or tool call (connection refused, reset or 403). It is not transient: do not retry it or work around it; say which host the task needs.

  # Values written before platformPrompt carry the note in systemMessage and
  # no flag: they render the chart's note, never none and never two.
  - it: replaces a network access note in systemMessage without the flag and keeps the text around it
    set:
      agent:
        systemMessage: |-
          You keep the GitOps repositories tidy.

          ## Network access (set by the platform)

          Besides your model and your tools, your sandbox reaches only the registries of the toolchains mounted under /opt/kagent/tools.

          Open one pull request per repository.
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            You keep the GitOps repositories tidy.

            Open one pull request per repository.

            ## Network access (set by the platform)

            Besides your model and your tools, your sandbox reaches only the registries of the toolchains mounted under /opt/kagent/tools. A request to any other host is refused by the egress policy and shows up as a failed command or tool call (connection refused, reset or 403). It is not transient: do not retry it or work around it; say which host the task needs.

  - it: replaces a network access note with CRLF line endings
    set:
      agent:
        systemMessage: "You keep the GitOps repositories tidy.\r\n\r\n## Network access (set by the platform)\r\n\r\nBesides your model and your tools, your sandbox reaches only https://example.com.\r\n"
    asserts:
      - matchRegex:
          path: spec.template.systemPrompt
          pattern: '\AYou keep the GitOps repositories tidy\.\n\n## Network access \(set by the platform\)\n\nBesides your model and your tools, your sandbox reaches only the registries of the toolchains'

  - it: replaces a network access note whose paragraph follows the heading directly and wraps over lines
    set:
      agent:
        systemMessage: |-
          You keep the GitOps repositories tidy.

          ## Network access (set by the platform)
          Besides your model and your tools, your sandbox reaches only
          these origins: https://example.com.

          Open one pull request per repository.
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            You keep the GitOps repositories tidy.

            Open one pull request per repository.

            ## Network access (set by the platform)

            Besides your model and your tools, your sandbox reaches only the registries of the toolchains mounted under /opt/kagent/tools. A request to any other host is refused by the egress policy and shows up as a failed command or tool call (connection refused, reset or 403). It is not transient: do not retry it or work around it; say which host the task needs.

  - it: keeps the heading's text when it is not a line of its own
    set:
      agent:
        systemMessage: |-
          Never write a section titled ## Network access (set by the platform)

          yourself; the platform owns it.
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            Never write a section titled ## Network access (set by the platform)

            yourself; the platform owns it.

  - it: keeps the indentation a prompt starts with when it replaces a note
    set:
      agent:
        systemMessage: "    make test\nRun this first.\n\n## Network access (set by the platform)\n\nBesides your model and your tools, your sandbox reaches only https://example.com."
    asserts:
      - matchRegex:
          path: spec.template.systemPrompt
          pattern: '\A    make test\nRun this first\.\n\n## Network access \(set by the platform\)\n\n'

  - it: renders no network access note with platformPrompt set to null
    set:
      agent:
        platformPrompt: null
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: You are a helpful agent.

  - it: renders only the network access note when systemMessage held nothing but one
    set:
      agent:
        systemMessage: |-
          ## Network access (set by the platform)

          Besides your model and your tools, your sandbox reaches only the registries of the toolchains mounted under /opt/kagent/tools.
    asserts:
      - equal:
          path: spec.template.systemPrompt
          value: |-
            ## Network access (set by the platform)

            Besides your model and your tools, your sandbox reaches only the registries of the toolchains mounted under /opt/kagent/tools. A request to any other host is refused by the egress policy and shows up as a failed command or tool call (connection refused, reset or 403). It is not transient: do not retry it or work around it; say which host the task needs.

  - it: refuses a platformPrompt.egressNote that is not a boolean through the values schema
    set:
      agent:
        platformPrompt:
          egressNote: "yes"
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]platformPrompt[./]egressNote'

  - it: refuses an unknown platformPrompt section through the values schema
    set:
      agent:
        platformPrompt:
          mood: cheerful
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]platformPrompt'

  - it: references the ModelConfig by name
    set:
      modelConfig:
        name: claude-sonnet
    asserts:
      - equal:
          path: spec.template.modelConfig.name
          value: claude-sonnet

  # the Harness: referenced by name, never selected by label
  - it: references the Harness named by agent.harness
    set:
      agent:
        harness: claude
    asserts:
      - equal:
          path: spec.harnessRef.name
          value: claude
      - notExists:
          path: metadata.labels["agent-platform.giantswarm.io/harness"]

  - it: refuses an empty agent.harness through the values schema
    set:
      agent:
        harness: ""
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]harness'

  - it: keeps extraAgentSpec out of spec.harnessRef
    set:
      extraAgentSpec:
        harnessRef:
          name: other
    asserts:
      - equal:
          path: spec.harnessRef.name
          value: kagent
      - equal:
          path: spec.template.harnessRef.name
          value: other

  # labels and annotations: the cross-repo contract
  - it: merges extra labels over the standard set, the extra labels winning
    set:
      labels:
        giantswarm.io/owner: sre-team
        app: renamed
    asserts:
      - equal:
          path: metadata.labels["giantswarm.io/owner"]
          value: sre-team
      - equal:
          path: metadata.labels["app"]
          value: renamed
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: agent

  - it: renders display name and icon as the ui.giantswarm.io annotations next to extra annotations
    set:
      agent:
        displayName: "SRE Assistant ✨"
        iconUrl: https://avatars.example.com/sre.svg
      annotations:
        giantswarm.io/owner: sre-team
    asserts:
      - equal:
          path: metadata.annotations
          value:
            ui.giantswarm.io/display-name: "SRE Assistant ✨"
            ui.giantswarm.io/icon-url: https://avatars.example.com/sre.svg
            giantswarm.io/owner: sre-team

  - it: renders only the annotations that are set
    set:
      agent:
        iconUrl: https://avatars.example.com/sre.svg
    asserts:
      - equal:
          path: metadata.annotations
          value:
            ui.giantswarm.io/icon-url: https://avatars.example.com/sre.svg

  # skills
  - it: renders git and OCI skills as immutable sources
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
          path: runbooks
        - name: sre
          oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        - name: sha256-commit
          git:
            url: https://git.example.com/skills.git
            commit: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.skills
          value:
            - name: runbooks
              source:
                git:
                  url: https://github.com/example/skills
                  commit: 0123456789abcdef0123456789abcdef01234567
                path: runbooks
            - name: sre
              source:
                oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            - name: sha256-commit
              source:
                git:
                  url: https://git.example.com/skills.git
                  commit: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: renders no credentialRef anywhere while skillsGitAuthSecretRef is unset
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
    asserts:
      - notExists:
          path: spec.template.skills[0].source.git.credentialRef

  # private skill repositories: one credential fans out to every git skill
  - it: renders credentialRef {name, key token} on every git skill and none on OCI skills with skillsGitAuthSecretRef.name
    set:
      skillsGitAuthSecretRef:
        name: kagent-skills-token
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/private-skills
            commit: 0123456789abcdef0123456789abcdef01234567
          path: runbooks
        - name: sre
          oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        - name: public-too
          git:
            url: https://github.com/example/public-skills
            commit: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.skills
          value:
            - name: runbooks
              source:
                git:
                  url: https://github.com/example/private-skills
                  commit: 0123456789abcdef0123456789abcdef01234567
                  credentialRef:
                    name: kagent-skills-token
                    key: token
                path: runbooks
            - name: sre
              source:
                oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            - name: public-too
              source:
                git:
                  url: https://github.com/example/public-skills
                  commit: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  credentialRef:
                    name: kagent-skills-token
                    key: token

  - it: refuses a plain http git skill when skillsGitAuthSecretRef.name is set, naming the skill
    set:
      skillsGitAuthSecretRef:
        name: kagent-skills-token
      skills:
        - name: public
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
        - name: intranet
          git:
            url: http://git.corp.example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
    asserts:
      - failedTemplate:
          errorPattern: 'skills\[1\] "intranet": skillsGitAuthSecretRef.name is set, so every git source needs an https:// URL'

  - it: refuses an unknown key under skillsGitAuthSecretRef through the values schema
    set:
      skillsGitAuthSecretRef:
        name: kagent-skills-token
        key: password
    asserts:
      - failedTemplate:
          errorPattern: 'skillsGitAuthSecretRef'

  - it: refuses a skillsGitAuthSecretRef.name that is not a Secret name through the values schema
    set:
      skillsGitAuthSecretRef:
        name: Kagent_Skills
    asserts:
      - failedTemplate:
          errorPattern: 'skillsGitAuthSecretRef[./]name'

  - it: refuses two skills with the same name, naming both entries
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
        - name: runbooks
          oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    asserts:
      - failedTemplate:
          errorPattern: 'skills\[1\]\.name "runbooks" is already used by skills\[0\]'

  - it: refuses a git branch as the commit
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: main
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]git[./]commit'

  - it: refuses a git tag as the commit
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: v1.4.0
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]git[./]commit'

  - it: refuses a short SHA as the commit
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]git[./]commit'

  - it: refuses a git URL that is not http(s)
    set:
      skills:
        - name: runbooks
          git:
            url: git@github.com:example/skills.git
            commit: 0123456789abcdef0123456789abcdef01234567
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]git[./]url'

  - it: refuses an OCI tag instead of a digest
    set:
      skills:
        - name: sre
          oci: registry.example.io/skills/sre:1.4.0
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]oci'

  - it: refuses a path with a .. segment
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
          path: ../outside
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]path'

  - it: refuses an absolute path
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
          path: /skills/runbooks
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0[./]path'

  - it: refuses a skill with both git and oci
    set:
      skills:
        - name: runbooks
          git:
            url: https://github.com/example/skills
            commit: 0123456789abcdef0123456789abcdef01234567
          oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0'

  - it: refuses a skill without a source
    set:
      skills:
        - name: runbooks
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0'

  - it: refuses a skill without a name
    set:
      skills:
        - oci: registry.example.io/skills/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    asserts:
      - failedTemplate:
          errorPattern: 'skills[./]0.*name'

  - it: refuses the 0.x skills object shape (refs, gitRefs, gitAuthSecretRef)
    values:
      - values/skills-0x-object.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'skills'

  # plugins: bundles pinned like skills, with the skills to enable
  - it: renders git and OCI plugins as immutable sources with their skill selection
    set:
      plugins:
        - git:
            url: https://github.com/example/plugins
            commit: 0123456789abcdef0123456789abcdef01234567
          path: bundles/sre
          skills:
            - triage
            - postmortem
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - k8s
    asserts:
      - equal:
          path: spec.template.plugins
          value:
            - source:
                git:
                  url: https://github.com/example/plugins
                  commit: 0123456789abcdef0123456789abcdef01234567
                path: bundles/sre
              skills:
                - triage
                - postmortem
            - source:
                oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
              skills:
                - k8s
      - notExists:
          path: spec.template.skills

  - it: fans the git credential out to every git plugin and none of the OCI plugins
    set:
      skillsGitAuthSecretRef:
        name: kagent-skills-token
      plugins:
        - git:
            url: https://github.com/example/private-plugins
            commit: 0123456789abcdef0123456789abcdef01234567
          skills:
            - triage
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - k8s
    asserts:
      - equal:
          path: spec.template.plugins[0].source.git.credentialRef
          value:
            name: kagent-skills-token
            key: token
      - notExists:
          path: spec.template.plugins[1].source.credentialRef

  - it: refuses a plain http git plugin when skillsGitAuthSecretRef.name is set, naming the entry
    set:
      skillsGitAuthSecretRef:
        name: kagent-skills-token
      plugins:
        - git:
            url: http://git.corp.example/plugins
            commit: 0123456789abcdef0123456789abcdef01234567
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins\[0\]: skillsGitAuthSecretRef.name is set, so every git source needs an https:// URL'

  - it: refuses a git branch as a plugin commit
    set:
      plugins:
        - git:
            url: https://github.com/example/plugins
            commit: main
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0[./]git[./]commit'

  - it: refuses an OCI tag as a plugin source
    set:
      plugins:
        - oci: registry.example.io/plugins/sre:1.4.0
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0[./]oci'

  - it: refuses a plugin with both git and oci
    set:
      plugins:
        - git:
            url: https://github.com/example/plugins
            commit: 0123456789abcdef0123456789abcdef01234567
          oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0'

  - it: refuses a plugin without a source
    set:
      plugins:
        - skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0'

  - it: renders a plugin without a skill selection (a Claude Code format plugin loads whole)
    set:
      plugins:
        - git:
            url: https://github.com/example/claude-plugins
            commit: 0123456789abcdef0123456789abcdef01234567
          path: plugins/review
    asserts:
      - equal:
          path: spec.template.plugins
          value:
            - source:
                git:
                  url: https://github.com/example/claude-plugins
                  commit: 0123456789abcdef0123456789abcdef01234567
                path: plugins/review

  - it: renders an empty skill selection without the skills key
    set:
      plugins:
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills: []
    asserts:
      - equal:
          path: spec.template.plugins
          value:
            - source:
                oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

  - it: refuses an empty skill name on a plugin
    set:
      plugins:
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - ""
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0[./]skills[./]0'

  - it: refuses a skill selected twice in one plugin
    set:
      plugins:
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - triage
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0[./]skills'

  - it: refuses a plugin skill whose name skills[] already uses, naming both entries
    set:
      skills:
        - name: triage
          oci: registry.example.io/skills/triage@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      plugins:
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - k8s
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins\[0\]\.skills\[1\] "triage" is already used by skills\[0\]'

  - it: refuses a skill two plugins select, naming both entries
    set:
      plugins:
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - triage
        - git:
            url: https://github.com/example/plugins
            commit: 0123456789abcdef0123456789abcdef01234567
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins\[1\]\.skills\[0\] "triage" is already used by plugins\[0\]\.skills\[0\]'

  - it: refuses a plugin path with a .. segment
    set:
      plugins:
        - oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          path: ../outside
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0[./]path'

  - it: refuses a named plugin (a plugin has no name, its skills are selected by name)
    set:
      plugins:
        - name: sre
          oci: registry.example.io/plugins/sre@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          skills:
            - triage
    asserts:
      - failedTemplate:
          errorPattern: 'plugins[./]0'

  # system prompt size
  - it: accepts a systemMessage at its cap, counted in characters
    values:
      - values/system-message-at-cap.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: refuses a systemMessage past its cap
    values:
      - values/system-message-over-cap.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]systemMessage'

  # tools
  - it: narrows the binding with muster.tools
    set:
      muster:
        tools:
          - list_tools
          - call_tool
    asserts:
      - equal:
          path: spec.template.tools[0].mcp.tools
          value:
            - list_tools
            - call_tool

  - it: gates every muster tool call behind a human approval with muster.requireApproval
    set:
      muster:
        requireApproval: true
    asserts:
      - lengthEqual:
          path: spec.template.tools
          count: 1
      - equal:
          path: spec.template.tools[0].mcp.server.name
          value: demo
      - equal:
          path: spec.template.tools[0].mcp.requireApproval
          value: true
      - notExists:
          path: spec.template.tools[0].mcp.tools

  - it: gates the narrowed binding when muster.requireApproval and muster.tools are combined
    set:
      muster:
        requireApproval: true
        tools:
          - call_tool
    asserts:
      - equal:
          path: spec.template.tools[0].mcp
          value:
            server:
              kind: RemoteMCPServer
              name: demo
            tools:
              - call_tool
            requireApproval: true

  - it: refuses a non-boolean muster.requireApproval through the values schema
    set:
      muster:
        requireApproval: "yes"
    asserts:
      - failedTemplate:
          errorPattern: 'muster[./]requireApproval'

  - it: appends extraTools after the muster binding
    set:
      extraTools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: github
            requireApproval: true
        - subAgent:
            name: reviewer
            description: Reviews the plan before it is executed.
            templateRef:
              name: reviewer
    asserts:
      - lengthEqual:
          path: spec.template.tools
          count: 3
      - equal:
          path: spec.template.tools[0].mcp.server.name
          value: demo
      - equal:
          path: spec.template.tools[1].mcp.server.name
          value: github
      - equal:
          path: spec.template.tools[1].mcp.requireApproval
          value: true
      - equal:
          path: spec.template.tools[2].subAgent.templateRef.name
          value: reviewer

  - it: renders no tools at all for exactly ["preset:none"]
    set:
      toolset:
        - preset:none
    asserts:
      - notExists:
          path: spec.template.tools

  - it: renders no tools for ["preset:none"] even with muster.requireApproval
    set:
      toolset:
        - preset:none
      muster:
        requireApproval: true
    asserts:
      - notExists:
          path: spec.template.tools

  - it: renders only the extraTools for ["preset:none"] with extraTools
    set:
      toolset:
        - preset:none
      extraTools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: github
    asserts:
      - lengthEqual:
          path: spec.template.tools
          count: 1
      - equal:
          path: spec.template.tools[0].mcp.server.name
          value: github

  - it: keeps the muster binding when preset:none is combined with other selectors
    set:
      toolset:
        - preset:none
        - tool:x_mcp-kubernetes_get_pods
    asserts:
      - equal:
          path: spec.template.tools[0].mcp.server.name
          value: demo

  - it: renders no muster binding when muster is disabled
    set:
      toolset:
        - preset:read-only
      muster:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.tools

  # extraAgentSpec
  - it: deep-merges extraAgentSpec over the curated template, the escape hatch winning
    set:
      extraAgentSpec:
        modelConfig:
          name: other-model
        promptTemplate:
          dataSources:
            - name: runbook-index
    asserts:
      - equal:
          path: spec.template.modelConfig.name
          value: other-model
      - equal:
          path: spec.template.promptTemplate.dataSources[0].name
          value: runbook-index
      - equal:
          path: spec.template.systemPrompt
          value: You are a helpful agent.

  # removed 0.x values: the schema refuses every one of them
  - it: refuses agent.runtime
    set:
      agent:
        runtime: go
    asserts:
      - failedTemplate:
          errorPattern: runtime

  - it: refuses replicas
    set:
      replicas: 1
    asserts:
      - failedTemplate:
          errorPattern: replicas

  - it: refuses resources
    set:
      resources:
        limits:
          cpu: "1"
    asserts:
      - failedTemplate:
          errorPattern: resources

  - it: refuses nodeSelector
    set:
      nodeSelector:
        kubernetes.io/arch: amd64
    asserts:
      - failedTemplate:
          errorPattern: nodeSelector

  - it: refuses tolerations
    set:
      tolerations:
        - key: dedicated
          operator: Exists
    asserts:
      - failedTemplate:
          errorPattern: tolerations

  - it: refuses muster.serverRef
    set:
      muster:
        serverRef:
          name: muster
          namespace: agent-platform
    asserts:
      - failedTemplate:
          errorPattern: serverRef

  - it: refuses muster.allowedHeaders
    set:
      muster:
        allowedHeaders:
          - authorization
    asserts:
      - failedTemplate:
          errorPattern: allowedHeaders

  - it: refuses muster.toolNames (renamed to muster.tools)
    set:
      muster:
        toolNames:
          - list_tools
    asserts:
      - failedTemplate:
          errorPattern: toolNames

  - it: refuses muster.stsWellKnownUri
    set:
      muster:
        stsWellKnownUri: http://muster.agent-platform.svc.cluster.local:8090/.well-known/oauth-authorization-server
    asserts:
      - failedTemplate:
          errorPattern: stsWellKnownUri

  # toolset render failures (the grammar is unchanged)
  - it: fails on an empty toolset and points at preset:none
    set:
      toolset: []
    asserts:
      - failedTemplate:
          errorPattern: 'toolset is empty.*preset:none'

  - it: fails above 32 selectors and says to define a preset
    set:
      toolset:
        - tool:t01
        - tool:t02
        - tool:t03
        - tool:t04
        - tool:t05
        - tool:t06
        - tool:t07
        - tool:t08
        - tool:t09
        - tool:t10
        - tool:t11
        - tool:t12
        - tool:t13
        - tool:t14
        - tool:t15
        - tool:t16
        - tool:t17
        - tool:t18
        - tool:t19
        - tool:t20
        - tool:t21
        - tool:t22
        - tool:t23
        - tool:t24
        - tool:t25
        - tool:t26
        - tool:t27
        - tool:t28
        - tool:t29
        - tool:t30
        - tool:t31
        - tool:t32
        - tool:t33
    asserts:
      - failedTemplate:
          errorPattern: 'toolset has 33 selectors.*define a preset'

  - it: "refuses toolset:<name> as reserved"
    set:
      toolset:
        - preset:read-only
        - toolset:foo
    asserts:
      - failedTemplate:
          errorPattern: '"toolset:foo".*reserved for shared toolsets'

  - it: "refuses an inline label: selector"
    set:
      toolset:
        - label:agent-platform.giantswarm.io/tool-group=infrastructure
    asserts:
      - failedTemplate:
          errorPattern: 'label: selectors are allowed inside presets only'

  - it: refuses a selector without a known prefix
    set:
      toolset:
        - read-only
    asserts:
      - failedTemplate:
          errorPattern: '"read-only" is invalid.*preset:<name>, server:<name>, workflow:<name> or tool:<name>'

  - it: refuses a selector with whitespace in the name
    set:
      toolset:
        - "preset:read only"
    asserts:
      - failedTemplate:
          errorPattern: '"preset:read only" is invalid'

  - it: refuses a selector with a comma in the name
    set:
      toolset:
        - "tool:a,tool:b"
    asserts:
      - failedTemplate:
          errorPattern: '"tool:a,tool:b" is invalid'

  - it: refuses a selector with an empty name
    set:
      toolset:
        - "preset:"
    asserts:
      - failedTemplate:
          errorPattern: '"preset:" is invalid'

  - it: refuses a non-list toolset through the values schema
    set:
      toolset: preset:read-only
    asserts:
      - failedTemplate:
          errorPattern: toolset

  - it: keeps the chart and version labels valid when the 63-character cut lands on the digest separator
    chart:
      version: 0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8+ed59d4befc7e
    asserts:
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^[a-zA-Z0-9][-A-Za-z0-9_.]{0,61}[a-zA-Z0-9]$
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: agent-0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: ^[a-zA-Z0-9][-A-Za-z0-9_.]{0,61}[a-zA-Z0-9]$

  - it: keeps the chart label valid when the 63-character cut lands on a dot
    chart:
      version: 0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8.x+ed59d4befc7e
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: agent-0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^[a-zA-Z0-9][-A-Za-z0-9_.]{0,61}[a-zA-Z0-9]$

  - it: keeps the chart label valid when the 63-character cut lands on a dash
    chart:
      version: 0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8-x+ed59d4befc7e
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: agent-0.6.2-dev.chart-1-0-agenttemplate.2026-09-10.23-36-48.h8
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^[a-zA-Z0-9][-A-Za-z0-9_.]{0,61}[a-zA-Z0-9]$

  # context.compaction is accepted for the values of existing releases and
  # renders nothing: compaction lives on the platform Harness
  # (kagent-dev/kagent#2790); the template has no context field.
  - it: renders no spec.context whatever context.compaction says
    set:
      context:
        compaction:
          enabled: true
          tokenThreshold: 1000
          eventRetentionSize: 2
          compactionInterval: 3
          overlapSize: 1
          summarizer:
            modelConfig: cheap
            promptTemplate: "Summarise {conversation_history}"
    asserts:
      - notExists:
          path: spec.template.context

  # egress: Agent.spec.egress, HTTP(S) and tls:// origins beyond what the revision compiles
  - it: renders no spec.egress by default
    asserts:
      - notExists:
          path: spec.egress

  - it: renders agent.egress as spec.egress
    set:
      agent:
        egress:
          - https://github.com:443
          - https://*.githubusercontent.com
    asserts:
      - equal:
          path: spec.egress
          value:
            - https://github.com:443
            - https://*.githubusercontent.com

  - it: refuses an egress entry that is not an HTTP(S) origin through the values schema
    set:
      agent:
        egress:
          - github.com
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses an egress origin with a path through the values schema
    set:
      agent:
        egress:
          - https://github.com/giantswarm
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses a wildcard over a top-level domain through the values schema
    set:
      agent:
        egress:
          - https://*.com
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: renders tls:// egress origins next to HTTP(S) ones
    set:
      agent:
        egress:
          - https://github.com:443
          - tls://db.example.com:5432
          - tls://*.kafka.example.com:9093
    asserts:
      - equal:
          path: spec.egress
          value:
            - https://github.com:443
            - tls://db.example.com:5432
            - tls://*.kafka.example.com:9093

  - it: refuses a tls:// egress origin without a port through the values schema
    set:
      agent:
        egress:
          - tls://db.example.com
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses a tls:// egress origin with a path through the values schema
    set:
      agent:
        egress:
          - tls://db.example.com:5432/orders
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses a tls:// egress origin on an IP address through the values schema
    set:
      agent:
        egress:
          - tls://192.0.2.1:5432
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses a tls:// wildcard over every host through the values schema
    set:
      agent:
        egress:
          - tls://*:443
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses an egress scheme other than http, https or tls through the values schema
    set:
      agent:
        egress:
          - tcp://git.example.com:22
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  - it: refuses a repeated egress origin through the values schema
    set:
      agent:
        egress:
          - https://github.com
          - https://github.com
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egress'

  # egressPolicyRefs: Agent.spec.egressPolicyRefs, the namespace's EgressPolicies by name
  - it: renders no spec.egressPolicyRefs by default
    asserts:
      - notExists:
          path: spec.egressPolicyRefs

  - it: renders agent.egressPolicyRefs as spec.egressPolicyRefs names next to spec.egress
    set:
      agent:
        egress:
          - https://example.com
        egressPolicyRefs:
          - github
          - go-modules
    asserts:
      - equal:
          path: spec.egressPolicyRefs
          value:
            - name: github
            - name: go-modules
      - equal:
          path: spec.egress
          value:
            - https://example.com

  - it: refuses an empty EgressPolicy name through the values schema
    set:
      agent:
        egressPolicyRefs:
          - ""
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egressPolicyRefs'

  - it: refuses an EgressPolicy name that is not a resource name through the values schema
    set:
      agent:
        egressPolicyRefs:
          - GitHub
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egressPolicyRefs'

  - it: refuses a repeated EgressPolicy name through the values schema
    set:
      agent:
        egressPolicyRefs:
          - github
          - github
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egressPolicyRefs'

  - it: refuses more than 16 EgressPolicy names through the values schema
    set:
      agent:
        egressPolicyRefs: [p1, p2, p3, p4, p5, p6, p7, p8, p9, p10, p11, p12, p13, p14, p15, p16, p17]
    asserts:
      - failedTemplate:
          errorPattern: 'agent[./]egressPolicyRefs'
