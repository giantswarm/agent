{{- /*
The agent: one api.kagent.dev/v1alpha3 Agent named after the release. The
template is inline (spec.template: what the agent is) and the Harness is
referenced by name (spec.harnessRef: how it runs). The Harness never has to
admit the agent, so no admission label is rendered.
*/ -}}
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  {{- with fromYaml (include "agent.annotations" .) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  harnessRef:
    name: {{ .Values.agent.harness | quote }}
  {{- include "agent.egress.validate" . }}
  {{- with .Values.agent.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "agent.spec" . | nindent 4 }}
