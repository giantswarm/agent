apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.agent.displayName .Values.annotations }}
  annotations:
    {{- with .Values.agent.displayName }}
    ui.giantswarm.io/display-name: {{ . | quote }}
    {{- end }}
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- include "agent.spec" . | nindent 2 }}
