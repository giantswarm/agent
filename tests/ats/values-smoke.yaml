# Values of the smoke release (test_smoke.py): every field the chart maps, in a
# shape that reaches Ready on the platform Harness — a display name, an icon, a
# description, a system prompt, a toolset with a narrowed muster binding, a
# public git skill pinned to a commit (materialised during the golden boot),
# extra labels and annotations. test_smoke.py asserts what these values render
# and that the template boots. Shapes that cannot boot (an OCI skill on a
# placeholder registry, a binding to a RemoteMCPServer that does not exist)
# are render-tested in helm/agent/tests/ instead.
agent:
  displayName: "ATS Smoke Agent"
  description: Exercises the chart's field mapping on the platform's runtime.
  iconUrl: https://avatars.example.com/ats-smoke.svg
  systemMessage: |
    You are the chart's smoke test. Be brief.
toolset:
  - preset:read-only
  - server:mcp-kubernetes
muster:
  tools:
    - list_tools
    - call_tool
skills:
  - name: agent-self-awareness
    git:
      url: https://github.com/giantswarm/agent-skills
      commit: cb1fb768bbbbcaa035b884a99ad308b14f846468
    path: agent-self-awareness
labels:
  giantswarm.io/owner: ats
annotations:
  giantswarm.io/scenario: smoke
