# Values of the ATS smoke release (.ats/main.yaml app-tests-app-config-file):
# every field the chart maps, so admission by the v1alpha3 CRDs covers the
# whole contract. test_smoke.py asserts what these values render.
agent:
  displayName: "ATS Smoke Agent"
  description: Exercises the chart's field mapping against the v1alpha3 CRDs.
  iconUrl: https://avatars.example.com/ats-smoke.svg
  systemMessage: |
    You are the chart's smoke test. Be brief.
toolset:
  - preset:read-only
  - server:mcp-kubernetes
muster:
  tools:
    - list_tools
    - call_tool
skills:
  - name: agent-self-awareness
    git:
      url: https://github.com/giantswarm/agent-skills
      commit: cb1fb768bbbbcaa035b884a99ad308b14f846468
    path: agent-self-awareness
  - name: runbooks
    oci: registry.example.io/skills/runbooks@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
extraTools:
  - mcp:
      server:
        kind: RemoteMCPServer
        name: github
      requireApproval: true
labels:
  giantswarm.io/owner: ats
annotations:
  giantswarm.io/scenario: smoke
