# app-test-suite (ATS >= 1.0) config. Consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests), which creates the
# kind cluster and hands ATS its kubeconfig.

# Test execution is skipped for now: the chart renders exactly one kagent
# Agent CR, so `helm install` on a bare kind cluster fails on the missing
# CRD. ATS 1.x can bootstrap extra CRDs before the deploy (`cluster-crds`),
# and the smoke test under tests/ats is written against that contract
# (ATS_RELEASE_* env vars). Same approach as giantswarm/kagent.
# @TODO: remove `smoke` from skip-steps and add
#   cluster-crds: https://raw.githubusercontent.com/giantswarm/kagent/v0.1.25/helm/kagent/crds/kagent.dev/kagent.dev_agents.yaml
# once that first real run is validated.
skip-steps: [smoke,functional,upgrade]
