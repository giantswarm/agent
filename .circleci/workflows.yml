# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
#
# Local deviations from the generated default, until this repo is registered
# in giantswarm/github (align-files will then reconcile):
# - branch builds push to the test catalog (push_to_appcatalog: true) so PRs
#   demonstrate the publish path
# - the run-tests-with-ats jobs are removed: ATS's smoke scenario deploys the
#   chart into a bare kind cluster, which lacks the kagent CRDs the Agent CR
#   needs; re-add once an .ats config with a kagent bootstrap exists
version: 2.1
orbs:
  architect: giantswarm/architect@9.5.2

workflows:
  build:
    jobs:

    # build-chart: package + lint via app-build-suite; on branches the chart
    # is pushed to the test catalog (giantswarm-test-catalog).
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: agent
        push_to_appcatalog: true
        push_to_oci_registry: true
        persist_chart_archive: true
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main

    # Tag: push chart to the release catalog.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart-release
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: agent
        requires:
        - build-chart
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
